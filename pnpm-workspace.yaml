packages:
  - apps/*
  - packages/*
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/router-server@57.0.13'
  - babel-preset-expo@57.0.16
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.30
  - '@expo/metro-runtime@57.0.17'
  - '@expo/ui@57.0.25'
  - expo-linking@57.0.13
  - expo-notifications@57.0.23
  - expo-router@57.0.28
# One React in the repo, pinned to the version the Expo SDK (apps/mobile) requires.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
