name: CI
on:
  # Branches run through their pull request; pushing to a PR branch would otherwise run every job twice.
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
  # Each suite on its own runner, so they don't compete for CPU with each other and the API's Postgres container.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: api, filter: '@taskop/api' }
          - { name: web, filter: '@taskop/web' }
          - { name: mobile, filter: '@taskop/mobile' }
          - { name: landing, filter: '@taskop/landing' }
          - { name: packages, filter: './packages/*' }
    name: test (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test --filter='${{ matrix.suite.filter }}'
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [checks, test]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: taskop
          POSTGRES_USER: taskop_owner
          POSTGRES_PASSWORD: owner_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskop_owner -d taskop" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_OWNER_URL: postgres://taskop_owner:owner_ci_password@localhost:5432/taskop
      DATABASE_APP_URL: postgres://taskop_app:app_ci_password@localhost:5432/taskop
      DATABASE_PLATFORM_URL: postgres://taskop_platform:platform_ci_password@localhost:5432/taskop
      APP_DB_PASSWORD: app_ci_password
      PLATFORM_DB_PASSWORD: platform_ci_password
      WEB_URL: http://localhost:5173
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: Taskop <no-reply@taskop.ci>
      COOKIE_SECURE: 'false'
      LOG_LEVEL: warn
      # Every spec signs up its own tenant: 9 of the default 10 per hour, so one retry would hit the limit.
      RL_SIGNUP_IP_PER_HOUR: '100'
      # SeaweedFS and Mailpit run as containers (step below): the audit report is stored there and mailed (SP8).
      S3_ENDPOINT: http://localhost:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: taskop
      S3_SECRET_KEY: taskop_dev_password
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start object storage and the mail catcher
        env:
          AWS_ACCESS_KEY_ID: taskop
          AWS_SECRET_ACCESS_KEY: taskop_dev_password
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs:latest server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
          for i in $(seq 1 30); do
            aws --endpoint-url http://localhost:8333 s3api head-bucket --bucket taskop-media 2>/dev/null && break
            aws --endpoint-url http://localhost:8333 s3api create-bucket --bucket taskop-media 2>/dev/null && break
            sleep 2
          done
          aws --endpoint-url http://localhost:8333 s3api head-bucket --bucket taskop-media
      - name: Prepare database and JWT keys
        run: |
          cd apps/api
          touch .env
          pnpm exec tsx src/db/scripts/setup.ts
          pnpm exec tsx src/db/scripts/seed.ts
          pnpm exec tsx src/scripts/generate-keys.ts | sed 's/"//g' >> "$GITHUB_ENV"
      - run: pnpm --filter @taskop/web exec playwright install --with-deps chromium
      - run: pnpm --filter @taskop/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
